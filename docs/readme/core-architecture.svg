<text x="190.0" y="290.0" text-anchor="middle" class="title">Convention expo scene</text>
<rect x="420" y="100" width="280" height="50" class="box" />
<text x="560.0" y="130.0" text-anchor="middle" class="title">LocalPlayerInteractionComponent</text>
<rect x="420" y="170" width="280" height="50" class="box" />
<text x="560.0" y="200.0" text-anchor="middle" class="title">LocalTalkConversationSubsystem</text>
<rect x="420" y="240" width="280" height="50" class="box" />
<text x="560.0" y="270.0" text-anchor="middle" class="title">LocalCharacterComponent</text>
<rect x="420" y="310" width="280" height="50" class="box" />
<text x="560.0" y="340.0" text-anchor="middle" class="title">LocalTalkerSettings</text>
<rect x="790" y="100" width="240" height="50" class="box" />
<text x="910.0" y="130.0" text-anchor="middle" class="title">Whisper / faster-whisper</text>
<rect x="790" y="180" width="240" height="50" class="box" />
<text x="910.0" y="210.0" text-anchor="middle" class="title">llama.cpp</text>
<rect x="790" y="260" width="240" height="50" class="box" />
<text x="910.0" y="290.0" text-anchor="middle" class="title">Kokoro ONNX TTS</text>
<line x1="330" y1="125" x2="410.0" y2="125.0" class="edge-animated" marker-end="url(#arrowhead-anim)" />
<line x1="700" y1="125" x2="780.0" y2="125.0" class="edge-animated" marker-end="url(#arrowhead-anim)" />
<path d="M 330 125 C 370.0 125, 370.0 195, 410 195" class="edge-animated" marker-end="url(#arrowhead-anim)" fill="none" />
<line x1="560" y1="220" x2="560.0" y2="230.0" class="edge-animated" marker-end="url(#arrowhead-anim)" />
<path d="M 700 255 C 740.0 255, 740.0 205, 780 205" class="edge-animated" marker-end="url(#arrowhead-anim)" fill="none" />
<path d="M 700 275 C 740.0 275, 740.0 285, 780 285" class="edge-animated" marker-end="url(#arrowhead-anim)" fill="none" />
<line x1="560" y1="310" x2="560.0" y2="300.0" class="edge-animated" marker-end="url(#arrowhead-anim)" />
<path d="M 420 335 C 360 335, 360 125, 410 125" class="edge-animated" marker-end="url(#arrowhead-anim)" fill="none" />
<line x1="190" y1="230" x2="190.0" y2="250.0" class="edge-animated" marker-end="url(#arrowhead-anim)" />
