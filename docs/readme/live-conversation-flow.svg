<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 650" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap');
            text { font-family: 'Inter', sans-serif; fill: #e0e0e0; font-size: 14px; }
            .title { font-weight: 600; font-size: 16px; fill: #ffffff; }
            .subtitle { font-size: 12px; fill: #a0a0a0; }
            .box { fill: #252526; stroke: #3e3e42; stroke-width: 2; rx: 8; ry: 8; }
            .box-highlight { fill: #2d2d30; stroke: #007acc; stroke-width: 2; rx: 8; ry: 8; }
            .subgraph { fill: rgba(255, 255, 255, 0.02); stroke: #454545; stroke-width: 1; stroke-dasharray: 5,5; rx: 12; ry: 12; }
            .edge { fill: none; stroke: #6b6b6b; stroke-width: 2; stroke-linejoin: round; }
            .edge-animated { fill: none; stroke: #00aaff; stroke-width: 2; stroke-dasharray: 8,8; animation: flow 1s linear infinite; stroke-linejoin: round; }
            .edge-animated-reverse { fill: none; stroke: #00aaff; stroke-width: 2; stroke-dasharray: 8,8; animation: flow-reverse 1s linear infinite; stroke-linejoin: round; }
            @keyframes flow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }
            @keyframes flow-reverse { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 16; } }
            .arrow { fill: #6b6b6b; }
            .arrow-animated { fill: #00aaff; }
            .icon { fill: #00aaff; }
            
            /* Sequence diagram specific */
            .seq-line { stroke: #3e3e42; stroke-width: 2; stroke-dasharray: 4,4; }
            .seq-box { fill: #252526; stroke: #007acc; stroke-width: 2; rx: 4; ry: 4; }
            .seq-msg { fill: none; stroke: #00aaff; stroke-width: 2; }
            .seq-msg-text { font-size: 12px; fill: #d4d4d4; }
            .seq-msg-anim { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2s ease forwards infinite; }
            @keyframes draw { to { stroke-dashoffset: 0; } }
            
            /* Architecture specific */
            .arch-group { fill: #1e1e1e; stroke: #333; stroke-width: 2; rx: 10; ry: 10; }
            .arch-group-title { font-weight: 600; font-size: 18px; fill: #888; }
            .arch-node { fill: #252526; stroke: #555; stroke-width: 2; rx: 6; ry: 6; transition: all 0.3s ease; }
            .arch-node:hover { stroke: #00aaff; transform: translateY(-2px); }
        </style>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
        </marker>
        <marker id="arrowhead-anim" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="arrow-animated" />
        </marker>
    </defs>
    <rect width="100%" height="100%" fill="#181818" rx="12" ry="12" />
    <rect x="40" y="40" width="120" height="40" class="seq-box" />
<text x="100" y="65" text-anchor="middle" class="title">Player</text>
<line x1="100" y1="80" x2="100" y2="600" class="seq-line" />
<rect x="230" y="40" width="120" height="40" class="seq-box" />
<text x="290" y="65" text-anchor="middle" class="title">Voice Input</text>
<line x1="290" y1="80" x2="290" y2="600" class="seq-line" />
<rect x="420" y="40" width="120" height="40" class="seq-box" />
<text x="480" y="65" text-anchor="middle" class="title">Whisper STT</text>
<line x1="480" y1="80" x2="480" y2="600" class="seq-line" />
<rect x="610" y="40" width="120" height="40" class="seq-box" />
<text x="670" y="65" text-anchor="middle" class="title">Director</text>
<line x1="670" y1="80" x2="670" y2="600" class="seq-line" />
<rect x="800" y="40" width="120" height="40" class="seq-box" />
<text x="860" y="65" text-anchor="middle" class="title">Character</text>
<line x1="860" y1="80" x2="860" y2="600" class="seq-line" />
<rect x="990" y="40" width="120" height="40" class="seq-box" />
<text x="1050" y="65" text-anchor="middle" class="title">llama.cpp</text>
<line x1="1050" y1="80" x2="1050" y2="600" class="seq-line" />
<rect x="1180" y="40" width="120" height="40" class="seq-box" />
<text x="1240" y="65" text-anchor="middle" class="title">Kokoro TTS</text>
<line x1="1240" y1="80" x2="1240" y2="600" class="seq-line" />
<line x1="100" y1="120" x2="280" y2="120" class="seq-msg" marker-end="url(#arrowhead-anim)" style="animation-delay: 0.0s;" />
<text x="195.0" y="110" text-anchor="middle" class="seq-msg-text">Speaks near a booth</text>
<path d="M 290 160 L 330 160 L 330 185 L 300 185" class="seq-msg" marker-end="url(#arrowhead-anim)" style="fill:none; animation-delay: 0.4s;" />
<text x="335" y="175" text-anchor="start" class="seq-msg-text">Detect speech, suppress noise</text>
<line x1="290" y1="205" x2="470" y2="205" class="seq-msg" marker-end="url(#arrowhead-anim)" style="animation-delay: 0.85s;" />
<text x="385.0" y="195" text-anchor="middle" class="seq-msg-text">Submit captured PCM audio</text>
<line x1="480" y1="245" x2="300" y2="245" class="seq-msg seq-line" marker-end="url(#arrowhead-anim)" style="animation-delay: 1.25s;" />
<text x="385.0" y="235" text-anchor="middle" class="seq-msg-text">Transcript</text>
<line x1="290" y1="285" x2="660" y2="285" class="seq-msg" marker-end="url(#arrowhead-anim)" style="animation-delay: 1.65s;" />
<text x="480.0" y="275" text-anchor="middle" class="seq-msg-text">Route recognized speech</text>
<path d="M 670 325 L 710 325 L 710 350 L 680 350" class="seq-msg" marker-end="url(#arrowhead-anim)" style="fill:none; animation-delay: 2.05s;" />
<text x="715" y="340" text-anchor="start" class="seq-msg-text">Record user line, prioritize</text>
<line x1="670" y1="370" x2="850" y2="370" class="seq-msg" marker-end="url(#arrowhead-anim)" style="animation-delay: 2.5s;" />
<text x="765.0" y="360" text-anchor="middle" class="seq-msg-text">Grant turn</text>
<line x1="860" y1="410" x2="1040" y2="410" class="seq-msg" marker-end="url(#arrowhead-anim)" style="animation-delay: 2.9s;" />
<text x="955.0" y="400" text-anchor="middle" class="seq-msg-text">Build prompt from persona</text>
<line x1="1050" y1="450" x2="870" y2="450" class="seq-msg seq-line" marker-end="url(#arrowhead-anim)" style="animation-delay: 3.3s;" />
<text x="955.0" y="440" text-anchor="middle" class="seq-msg-text">Stream generated text</text>
<line x1="860" y1="490" x2="1230" y2="490" class="seq-msg" marker-end="url(#arrowhead-anim)" style="animation-delay: 3.7s;" />
<text x="1050.0" y="480" text-anchor="middle" class="seq-msg-text">Chunk sentences for synthesis</text>
<line x1="1240" y1="530" x2="870" y2="530" class="seq-msg seq-line" marker-end="url(#arrowhead-anim)" style="animation-delay: 4.1s;" />
<text x="1050.0" y="520" text-anchor="middle" class="seq-msg-text">Speech audio</text>
<line x1="860" y1="570" x2="110" y2="570" class="seq-msg" marker-end="url(#arrowhead-anim)" style="animation-delay: 4.5s;" />
<text x="480.0" y="560" text-anchor="middle" class="seq-msg-text">Play voice + subtitles</text>
<line x1="860" y1="610" x2="680" y2="610" class="seq-msg" marker-end="url(#arrowhead-anim)" style="animation-delay: 4.9s;" />
<text x="765.0" y="600" text-anchor="middle" class="seq-msg-text">Broadcast spoken line</text>
<path d="M 670 650 L 710 650 L 710 675 L 680 675" class="seq-msg" marker-end="url(#arrowhead-anim)" style="fill:none; animation-delay: 5.3s;" />
<text x="715" y="665" text-anchor="start" class="seq-msg-text">Pick next speaker or pause</text>

</svg>